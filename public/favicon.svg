<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Silk Gradient -->
    <radialGradient id="silkBg" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3A152E" />
      <stop offset="45%" stop-color="#1F0819" />
      <stop offset="85%" stop-color="#0E030C" />
      <stop offset="100%" stop-color="#050106" />
    </radialGradient>

    <!-- Metallic Pink Rim Gradient -->
    <linearGradient id="pinkRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B9D" />
      <stop offset="30%" stop-color="#E6007A" />
      <stop offset="70%" stop-color="#99004C" />
      <stop offset="100%" stop-color="#FF5CB0" />
    </linearGradient>

    <!-- Gold Letter Gradient -->
    <linearGradient id="goldLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="15%" stop-color="#FFD043" />
      <stop offset="50%" stop-color="#F5A623" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Gold Bevel Edge Highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFEFA6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Silk Wave Gradient 1 -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B9D" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow Filter for Letters -->
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#451202" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#FFD700" flood-opacity="0.25" />
    </filter>

    <!-- Outer Rim Glow -->
    <filter id="rimGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FF2A93" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#silkBg)" />

  <!-- Background Silk Curve Effects -->
  <path d="M 20,180 Q 150,80 320,160 T 492,280 L 492,500 L 20,500 Z" fill="url(#wave1)" />
  <path d="M 20,320 C 120,240 280,420 492,310 L 492,500 L 20,500 Z" fill="#140310" opacity="0.6" />

  <!-- Diagonal Glass Sheen Reflection (Top-Left Highlight) -->
  <path d="M 12,120 L 12,120 A 108,108 0 0,1 120,12 L 340,12 L 12,340 Z" fill="url(#glassSheen)" />

  <!-- Outer Metallic Pink Frame -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#pinkRim)" stroke-width="12" filter="url(#rimGlow)" />
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="#FFA6D5" stroke-width="2" opacity="0.6" />

  <!-- CENTERED GOLD BOLD "VL" TYPOGRAPHY -->
  <g filter="url(#letterShadow)" transform="translate(0, 0)">
    <!-- Letter "V" -->
    <!-- Shadow stroke outline for depth -->
    <path d="M 102,175 L 180,175 L 235,335 L 290,175 L 368,175 L 270,395 L 200,395 Z" fill="#3D1700" />
    <!-- Main Gold Fill -->
    <path d="M 105,172 L 178,172 L 235,330 L 292,172 L 365,172 L 268,392 L 202,392 Z" fill="url(#goldLetter)" stroke="url(#goldHighlight)" stroke-width="3" stroke-linejoin="round" />

    <!-- Letter "L" -->
    <!-- Shadow stroke outline for depth -->
    <path d="M 285,175 L 358,175 L 358,328 L 418,328 L 418,395 L 285,395 Z" fill="#3D1700" />
    <!-- Main Gold Fill -->
    <path d="M 288,172 L 355,172 L 355,325 L 415,325 L 415,392 L 288,392 Z" fill="url(#goldLetter)" stroke="url(#goldHighlight)" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Top Edge Subtle Inner Glow Rim -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />
</svg>
